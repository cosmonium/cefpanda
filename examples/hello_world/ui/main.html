<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hello World</h1>
<script>
    // The Python functions are sent asynchronously to the page by CEF, so they might not be
    // available yet when the page is parsed: wait for them before calling them
    function call_py() {
        if (typeof call_py1 === 'undefined' || typeof call_py2 === 'undefined') {
            setTimeout(call_py, 10);
            return;
        }
        call_py1();
        call_py2();
    }
    call_py();
</script>
</body>
</html>
